# Render.com Blueprint -- https://render.com/docs/blueprint-spec
#
# Render auto-detects this file when you connect the repo and offers to
# create everything below with one click ("New +" -> "Blueprint"). See
# DEPLOY.md for the full step-by-step walkthrough.
#
# Free plan notes (see DEPLOY.md for details):
#   - No credit card required.
#   - Spins down after 15 min of no traffic, then takes ~30-60s to wake back
#     up on the next visit (bootstrap runs before the site responds).
#   - Local disk is not persistent across deploys, so the SQLite database
#     (accounts/watchlists) resets whenever you push a new version. Fine
#     for a demo/portfolio site; see DEPLOY.md if this ever needs to survive
#     redeploys.
#   - STOCKGRAPH_DATA_MODE is "demo" here (not "auto" like a local run) --
#     confirmed live: Yahoo Finance throttles/blocks Render's shared IPs
#     far more aggressively than a home connection, so "auto" mode's
#     per-ticker live fetch across 448 companies took 15+ minutes on this
#     free instance (vs. under a minute locally) before falling back to
#     demo data for most of them anyway. Since the free tier has no
#     persistent disk, that slow re-fetch would repeat on every wake from
#     sleep, not just on redeploys. "demo" boots instantly and reliably,
#     and is clearly labeled as synthetic data everywhere it appears --
#     switch back to "auto" only on a paid plan with a dedicated/static
#     outbound IP, where Yahoo is less likely to throttle it.
services:
  - type: web
    name: lumina-advisors
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: STOCKGRAPH_HOST
        value: 0.0.0.0
      - key: STOCKGRAPH_DATA_MODE
        value: demo
      - key: SEC_USER_AGENT
        value: "Lumina Advisors (contact: set-your-email@example.com)"
      - key: ANTHROPIC_API_KEY
        sync: false
